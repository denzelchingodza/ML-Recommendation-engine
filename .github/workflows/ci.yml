# Runs the backend tests on every pull request, and on every push to
# staging and main. A failing test means the PR should not be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
